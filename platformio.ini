; Two Raspberry Pi Pico W boards, Arduino-Pico core (earlephilhower).
;   pio run -e kasse -t upload        -> Pico 1 (Kasse)
;   pio run -e schranken -t upload    -> Pico 2 (Schranken)
; Change upload_port if Windows assigns other COM numbers.

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0m
monitor_speed = 115200
build_flags = -Wall

[env:kasse]
build_src_filter = +<kasse/>
upload_port = COM9
monitor_port = COM9

[env:schranken]
build_src_filter = +<schranken/>
upload_port = COM10
monitor_port = COM10
